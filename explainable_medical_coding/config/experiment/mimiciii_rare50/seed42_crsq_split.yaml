# @package _global_
defaults:
  - override /model: plm_icd
  - override /lr_scheduler: warmup_linear_decay
  - override /optimizer: adamw
  - override /callbacks: rare50_four
  - override /metrics: rare50_four
  - override /data: mimiciii_rare50
  - override /loss: paired_consistency

seed: 42
deterministic: true
gpu: 1
name: mimiciii-rare50-crsq-split-seed42
load_model: null
encoder_initialization_checkpoint: artifacts/mimiciii50_encoder_seed42.pt

paired_training:
  enabled: true
  augmentation_seed: 42
semantic_query:
  enabled: true
  description_path: artifacts/knowledge/gki_icd/code_description.csv
  synonym_path: artifacts/knowledge/gki_icd/code_synonym.json
  use_synonyms: true
  synonym_weight: 0.3
  max_synonyms: 5
  batch_size: 128
  max_length: 128
  frequency_gamma: 0.5
  frequency_weight_max: 5.0
dataloader:
  max_batch_size: 2
  batch_size: 16
optimizer:
  configs:
    lr: 5e-5
    weight_decay: 0
trainer:
  epochs: 30
  validate_on_training_data: false
  threshold_tuning: true
  clip_grad_norm: 1
  evaluate_test: true
data:
  max_length: 6000
model:
  configs:
    dropout: 0.2
loss:
  configs:
    consistency_lambda: 0.3
    consistency_mode: split_normalized
